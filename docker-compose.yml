version: '3.8'

services:
  # --- Layer 1: Cloud / Central Node ---
  central_node:
    build: ./central_node
    container_name: central_node
    environment:
      - NODE_TYPE=central
      - NODE_ID=main
    ports:
      - "5000:5000"  # Access: http://localhost:5000
    networks:
      - edge_network

  # --- Layer 2: Cluster Managers ---
  cluster_1:
    build: ./cluster_node
    container_name: cluster_1
    environment:
      - NODE_TYPE=cluster_manager
      - NODE_ID=1
      - PARENT_NODE=central_node
    ports:
      - "5001:5000"  # Access: http://localhost:5001
    networks:
      - edge_network

  cluster_2:
    build: ./cluster_node
    container_name: cluster_2
    environment:
      - NODE_TYPE=cluster_manager
      - NODE_ID=2
      - PARENT_NODE=central_node
    ports:
      - "5002:5000"  # Access: http://localhost:5002
    networks:
      - edge_network

  cluster_3:
    build: ./cluster_node
    container_name: cluster_3
    environment:
      - NODE_TYPE=cluster_manager
      - NODE_ID=3
      - PARENT_NODE=central_node
    ports:
      - "5003:5000"  # Access: http://localhost:5003
    networks:
      - edge_network

  # --- Layer 3: Edge Nodes ---
  # Cluster 1
  edge_1_c1:
    build: ./edge_node
    container_name: edge_1_c1
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=1_c1
      - PARENT_CLUSTER=cluster_1
      - RESOURCES_CPU=4
      - RESOURCES_RAM=8192
    ports:
      - "5004:5000"  # Access: http://localhost:5004
    networks:
      - edge_network

  edge_2_c1:
    build: ./edge_node
    container_name: edge_2_c1
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=2_c1
      - PARENT_CLUSTER=cluster_1
      - RESOURCES_CPU=2
      - RESOURCES_RAM=4096
    ports:
      - "5005:5000"  # Access: http://localhost:5005
    networks:
      - edge_network

  # Cluster 2
  edge_3_c2:
    build: ./edge_node
    container_name: edge_3_c2
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=3_c2
      - PARENT_CLUSTER=cluster_2
      - RESOURCES_CPU=4
      - RESOURCES_RAM=8192
    ports:
      - "5006:5000"  # Access: http://localhost:5006
    networks:
      - edge_network

  edge_4_c2:
    build: ./edge_node
    container_name: edge_4_c2
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=4_c2
      - PARENT_CLUSTER=cluster_2
      - RESOURCES_CPU=2
      - RESOURCES_RAM=4096
    ports:
      - "5007:5000"  # Access: http://localhost:5007
    networks:
      - edge_network

  # Cluster 3
  edge_5_c3:
    build: ./edge_node
    container_name: edge_5_c3
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=5_c3
      - PARENT_CLUSTER=cluster_3
      - RESOURCES_CPU=4
      - RESOURCES_RAM=8192
    ports:
      - "5008:5000"  # Access: http://localhost:5008
    networks:
      - edge_network

  edge_6_c3:
    build: ./edge_node
    container_name: edge_6_c3
    environment:
      - NODE_TYPE=edge_worker
      - NODE_ID=6_c3
      - PARENT_CLUSTER=cluster_3
      - RESOURCES_CPU=2
      - RESOURCES_RAM=4096
    ports:
      - "5009:5000"  # Access: http://localhost:5009
    networks:
      - edge_network

networks:
  edge_network:
    driver: bridge
